<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1115" viewBox="0 0 440 1115" role="img" aria-labelledby="title"><title id="title">UBI 데이터 처리의 전체 흐름</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#54836b" stroke-width="1.5"/></marker></defs><rect width="440" height="1115" rx="12" fill="#edf2ec"/><g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><text x="22" y="34" font-size="13" fill="#547460" letter-spacing="1.4">UBI / DATA PROCESSING</text><text x="22" y="69" font-size="24" fill="#193f33" font-weight="600">초 단위 기록에서 집단 비교까지</text><rect x="22" y="94" width="396" height="47" rx="7" fill="#dce9d2"/><text x="40" y="124" font-size="18" fill="#193f33" >DTG 운행 기록 · 약 1초 간격</text><path d="M220 141 V166" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="174" width="396" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="40" y="203" font-size="13" fill="#60816b" letter-spacing="1.2">01</text><text x="40" y="231" font-size="22" fill="#193f33" font-weight="600">원천 파싱·익명 ID 매핑</text><text x="40" y="254" font-size="15" fill="#5c7163" >고정 길이 TXT → CSV / Parquet</text><path d="M220 268 V299" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="307" width="396" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="40" y="336" font-size="13" fill="#60816b" letter-spacing="1.2">02</text><text x="40" y="364" font-size="22" fill="#193f33" font-weight="600">트립별 운전습관 피처</text><text x="40" y="387" font-size="15" fill="#5c7163" >속도 차분 · 방향각 · RPM · 브레이크</text><path d="M220 401 V432" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="440" width="396" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="40" y="469" font-size="13" fill="#60816b" letter-spacing="1.2">03</text><text x="40" y="497" font-size="22" fill="#193f33" font-weight="600">차량별 집계와 보정</text><text x="40" y="520" font-size="15" fill="#5c7163" >거리·시간 비율화 · 표준화 · 이상치 처리</text><path d="M220 534 V576 H12 V737 H20" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="42" y="593" width="356" height="63" rx="6" fill="#e0e9f1" stroke="#bdccda"/><text x="59" y="620" font-size="18" fill="#2f5063" font-weight="600">보험 사고 이력 결합 준비</text><text x="59" y="643" font-size="15" fill="#496678" >Excel 정제 · 사고회수 · 익명 ID</text><path d="M220 656 V682" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="690" width="396" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="40" y="719" font-size="13" fill="#60816b" letter-spacing="1.2">04</text><text x="40" y="747" font-size="22" fill="#193f33" font-weight="600">사고 이력 결합</text><text x="40" y="770" font-size="15" fill="#5c7163" >익명 차량 ID로 운행·보험정보 연결</text><path d="M220 784 V815" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="823" width="396" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="40" y="852" font-size="13" fill="#60816b" letter-spacing="1.2">05</text><text x="40" y="880" font-size="22" fill="#193f33" font-weight="600">사고 / 무사고 집단 비교</text><text x="40" y="903" font-size="15" fill="#5c7163" >사고회수로 구분 → F검정 · T-Test</text><path d="M220 917 V948" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="22" y="956" width="396" height="94" rx="8" fill="#194b3b" stroke="#194b3b"/><text x="40" y="985" font-size="13" fill="#d0ef9d" letter-spacing="1.2">06</text><text x="40" y="1013" font-size="22" fill="#ffffff" font-weight="600">분석 결과 자동 생성</text><text x="40" y="1036" font-size="15" fill="#d4e2d7" >Excel · CSV · 피처 분포 그래프</text><text x="22" y="1086" font-size="16" fill="#5c7163" >사고회수 0: 무사고 / 1 이상: 사고</text></g></svg>