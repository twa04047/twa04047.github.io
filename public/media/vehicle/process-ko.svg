<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1024" viewBox="0 0 820 1024" role="img" aria-labelledby="title"><title id="title">UBI 데이터 처리의 전체 흐름</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#54836b" stroke-width="1.5"/></marker></defs><rect width="820" height="1024" rx="12" fill="#edf2ec"/><g font-family="Segoe UI, Malgun Gothic, Arial, sans-serif"><text x="32" y="43" font-size="15" fill="#547460" letter-spacing="2">UBI / DATA PROCESSING</text><text x="32" y="84" font-size="30" fill="#193f33" font-weight="600">UBI 데이터 처리의 전체 흐름</text><rect x="32" y="113" width="470" height="54" rx="7" fill="#dce9d2"/><text x="52" y="147" font-size="20" fill="#193f33" >DTG 운행 기록 · 약 1초 간격</text><path d="M267 167 V196" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="204" width="470" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="50" y="233" font-size="13" fill="#60816b" letter-spacing="1.2">01</text><text x="50" y="261" font-size="22" fill="#193f33" font-weight="600">원천 파싱·익명 ID 매핑</text><text x="50" y="284" font-size="15" fill="#5c7163" >고정 길이 TXT → CSV / Parquet</text><path d="M267 298 V326" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="334" width="470" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="50" y="363" font-size="13" fill="#60816b" letter-spacing="1.2">02</text><text x="50" y="391" font-size="22" fill="#193f33" font-weight="600">트립별 운전습관 피처</text><text x="50" y="414" font-size="15" fill="#5c7163" >속도 차분 · 방향각 · RPM · 브레이크</text><path d="M267 428 V456" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="464" width="470" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="50" y="493" font-size="13" fill="#60816b" letter-spacing="1.2">03</text><text x="50" y="521" font-size="22" fill="#193f33" font-weight="600">차량별 집계와 보정</text><text x="50" y="544" font-size="15" fill="#5c7163" >거리·시간 비율화 · 표준화 · 이상치 처리</text><path d="M267 558 V586" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="594" width="470" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="50" y="623" font-size="13" fill="#60816b" letter-spacing="1.2">04</text><text x="50" y="651" font-size="22" fill="#193f33" font-weight="600">사고 이력 결합</text><text x="50" y="674" font-size="15" fill="#5c7163" >익명 차량 ID로 운행·보험정보 연결</text><path d="M267 688 V716" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="724" width="470" height="94" rx="8" fill="#ffffff" stroke="#c6d5c9"/><text x="50" y="753" font-size="13" fill="#60816b" letter-spacing="1.2">05</text><text x="50" y="781" font-size="22" fill="#193f33" font-weight="600">사고 / 무사고 집단 비교</text><text x="50" y="804" font-size="15" fill="#5c7163" >사고회수로 구분 → F검정 · T-Test</text><path d="M267 818 V846" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><rect x="32" y="854" width="470" height="94" rx="8" fill="#194b3b" stroke="#194b3b"/><text x="50" y="883" font-size="13" fill="#d0ef9d" letter-spacing="1.2">06</text><text x="50" y="911" font-size="22" fill="#ffffff" font-weight="600">분석 결과 자동 생성</text><text x="50" y="934" font-size="15" fill="#d4e2d7" >Excel · CSV · 피처 분포 그래프</text><rect x="551" y="462" width="237" height="117" rx="8" fill="#e0e9f1" stroke="#bdccda"/><text x="571" y="492" font-size="12" fill="#496678" letter-spacing="1.3">SECOND INPUT</text><text x="571" y="525" font-size="22" fill="#2f5063" font-weight="600">보험 사고 이력</text><text x="571" y="552" font-size="14" fill="#496678" >Excel 정제 · 사고회수 집계</text><path d="M668 579 V641 H510" fill="none" stroke="#54836b" stroke-width="2" marker-end="url(#arrow)"/><text x="551" y="696" font-size="14" fill="#193f33" >사고회수 = 0 → 무사고</text><text x="551" y="723" font-size="14" fill="#193f33" >사고회수 ≥ 1 → 사고</text><text x="32" y="995" font-size="15" fill="#5c7163" >식별자 매핑은 내부에서만 사용합니다. 실제 레코드는 공개하지 않습니다.</text></g></svg>